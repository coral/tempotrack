[package]
name = "tempotrack"
version = "0.1.0"
edition = "2024"
default-run = "tempotrack"

[[bin]]
name = "track-replay"
path = "tools/replay.rs"
required-features = ["offline"]

[dependencies]
beatnet-rs = "0.1.0"
pulseweave = "0.1.0"
cpal = "0.18.2"
rtrb = "0.4.0"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
directories = "6.0.0"
iced = { version = "0.14.0", optional = true, features = ["tokio", "advanced", "canvas"] }

[features]
default = ["gui"]
gui = ["dep:iced"]
offline = []

[profile.release]
lto = "thin"
codegen-units = 1
