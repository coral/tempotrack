[package]
name = "tempotrack"
version = "0.1.0"
edition = "2024"
default-run = "tempotrack"

[[bin]]
name = "track-replay"
path = "tools/replay.rs"
required-features = ["offline"]

[[bin]]
name = "output-probe"
path = "tools/output_probe.rs"
required-features = ["offline"]

[dependencies]
beatnet-rs = "0.1.0"
pulseweave = "0.1.0"
cpal = "0.18.2"
rtrb = "0.4.0"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
directories = "6.0.0"
ableton-link-rs = "0.1.2"
midir = "0.11.0"
rosc = "0.11.4"
rtpmidi = "0.4.4"
mdns-sd = "0.21.4"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync", "macros"] }
midi-types = "0.2.1"
iced = { version = "0.14.0", optional = true, features = ["tokio", "advanced", "canvas"] }

[features]
default = ["gui"]
gui = ["dep:iced"]
offline = []

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
block = { path = "vendor/block" }
ableton-link-rs = { path = "vendor/ableton-link-rs" }
rtpmidi = { path = "vendor/rtpmidi" }
